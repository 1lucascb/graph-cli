name: Publish to PyPI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tests:
    name: Run unit tests
    uses: ./.github/workflows/tests.yml

  release-check:
    name: Check version changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compare package version with latest tag
        id: check
        run: |
          python -m pip install packaging

          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          version = Version(
              tomllib.loads(
                  Path("pyproject.toml").read_text(encoding="utf-8")
              )["project"]["version"]
          )

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()

          versions = []
          for tag in tags:
              try:
                  versions.append(Version(tag.removeprefix("v")))
              except Exception:
                  continue

          latest = max(versions, default=None)

          print(f"Current version: {version}")
          print(f"Latest tag: {latest}")

          if latest is not None and version <= latest:
              if version < latest:
                  raise SystemExit("Package version cannot be lower than the latest tag.")

              print("No new version. Skipping release.")
              release = "false"
          else:
              print("New version detected. Preparing release.")
              release = "true"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"release={release}\n")
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

  publish:
    name: Build and publish
    needs: [tests, release-check]
    if: needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/graph-lcb

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create and push Git tag
        env:
          TAG: ${{ needs.release-check.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
