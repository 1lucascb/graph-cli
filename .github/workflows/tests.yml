name: Unit tests

on:
  workflow_call:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run unit tests
        run: python -m pytest
